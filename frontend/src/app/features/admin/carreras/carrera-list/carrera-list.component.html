<main class="app-page admin-portal">
  <section class="admin-toolbar">
    <div class="app-toolbar__title">
      <h1 class="app-section-title">Gestion de carreras</h1>
      <p>Catalogo academico asociado a las facultades institucionales.</p>
    </div>
    <a mat-flat-button color="primary" routerLink="nuevo">
      <mat-icon>add</mat-icon>
      Nueva carrera
    </a>
  </section>

  <section class="student-grid student-grid--3">
    <article class="student-stat">
      <span>Total</span>
      <strong>{{ carreras.length }}</strong>
    </article>
    <article class="student-stat">
      <span>Activas</span>
      <strong>{{ activas }}</strong>
    </article>
    <article class="student-stat">
      <span>Inactivas</span>
      <strong>{{ inactivas }}</strong>
    </article>
  </section>

  <app-skeleton *ngIf="loading" variant="table" [count]="5"></app-skeleton>

  <mat-card class="admin-surface admin-table-wrap" *ngIf="!loading">
    <table mat-table [dataSource]="carreras" class="w-full" *ngIf="carreras.length > 0">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let carrera">{{ carrera.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="facultad">
        <th mat-header-cell *matHeaderCellDef>Facultad</th>
        <td mat-cell *matCellDef="let carrera">{{ carrera.facultadNombre }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let carrera">
          <span class="admin-status-pill" [class.admin-status-pill--success]="carrera.estado === 'ACTIVO'" [class.admin-status-pill--danger]="carrera.estado !== 'ACTIVO'">
            {{ carrera.estado }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let carrera">
          <div class="student-card__meta">
            <a mat-icon-button color="accent" [routerLink]="['editar', carrera.id]" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </a>
            <button mat-icon-button color="warn" (click)="desactivar(carrera)" matTooltip="Desactivar">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <app-empty-state
      *ngIf="carreras.length === 0"
      icon="account_tree"
      title="No se encontraron carreras"
      message="Registre una carrera para comenzar la estructura academica."
      actionLabel="Nueva carrera"
      actionRoute="nuevo">
    </app-empty-state>
  </mat-card>
</main>
