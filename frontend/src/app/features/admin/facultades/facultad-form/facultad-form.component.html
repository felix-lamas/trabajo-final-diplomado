<main class="app-page admin-portal">
  <section class="admin-toolbar">
    <div class="app-toolbar__title">
      <h1 class="app-section-title">{{ esEdicion ? 'Editar' : 'Nueva' }} facultad</h1>
      <p>Formulario academico institucional.</p>
    </div>
    <a mat-stroked-button routerLink="/admin/facultades">
      <mat-icon>arrow_back</mat-icon>
      Volver
    </a>
  </section>

  <form [formGroup]="facultadForm" (ngSubmit)="guardar()" class="admin-form-shell">
    <mat-card class="admin-form-panel">
      <div class="app-form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre" placeholder="Ej. Facultad de Ciencias y Tecnologia" required>
          <mat-error *ngIf="facultadForm.get('nombre')?.hasError('required')">El nombre es obligatorio</mat-error>
          <mat-error *ngIf="facultadForm.get('nombre')?.hasError('minlength')">Minimo 3 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Descripcion</mat-label>
          <textarea matInput formControlName="descripcion" placeholder="Opcional..." rows="4"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" *ngIf="esEdicion">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="estado">
            <mat-option value="ACTIVO">ACTIVO</mat-option>
            <mat-option value="INACTIVO">INACTIVO</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </mat-card>

    <div class="student-card__footer" style="grid-column: 1 / -1;">
      <button mat-stroked-button type="button" routerLink="/admin/facultades">Cancelar</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="facultadForm.invalid">
        <mat-icon>save</mat-icon>
        Guardar
      </button>
    </div>
  </form>
</main>
