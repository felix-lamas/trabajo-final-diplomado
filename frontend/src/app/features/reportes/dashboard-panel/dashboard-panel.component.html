<main class="app-page organizer-dashboard" aria-labelledby="dashboard-title">
  <app-page-header
    [title]="esOrganizador ? 'Panel del organizador' : 'Panel de gestión'"
    [description]="esOrganizador
      ? 'Resumen de tus eventos, inscripciones, pagos y asistencia.'
      : 'Resumen de eventos, participación, pagos y certificados.'"
    [breadcrumbs]="[{ label: 'Dashboard', icon: 'space_dashboard' }]">
    <nav pageHeaderActions class="organizer-dashboard__actions" aria-label="Acciones del panel">
      <a mat-stroked-button routerLink="/reportes/generador">
        <mat-icon>description</mat-icon> Reportes
      </a>
      <a mat-flat-button color="primary" [routerLink]="rutaEventos">
        <mat-icon>event</mat-icon> {{ esOrganizador ? 'Mis eventos' : 'Eventos' }}
      </a>
      <a mat-stroked-button [routerLink]="rutaPagos">
        <mat-icon>payments</mat-icon> Pagos por validar
      </a>
    </nav>
  </app-page-header>

  <app-skeleton *ngIf="loading()" variant="dashboard" [count]="4" aria-label="Cargando indicadores"></app-skeleton>

  <ng-container *ngIf="!loading() && error()">
    <app-alert variant="error" title="No se pudo cargar el panel" icon="error_outline">
      <p>Ocurrió un problema al consultar los indicadores. Intenta nuevamente.</p>
    </app-alert>
    <button mat-stroked-button type="button" (click)="cargar()">Reintentar</button>
  </ng-container>

  <ng-container *ngIf="!loading() && !error() && ejecutivo() as resumen">
    <section class="organizer-dashboard__section" aria-labelledby="summary-title">
      <h2 id="summary-title">Resumen de actividad</h2>
      <div class="organizer-dashboard__stats">
        <app-stat-card label="Eventos" [value]="resumen.totalEventos" icon="event"></app-stat-card>
        <app-stat-card label="Participantes inscritos" [value]="resumen.totalParticipantes" icon="groups"></app-stat-card>
        <app-stat-card label="Inscripciones" [value]="resumen.totalInscripciones" icon="how_to_reg"></app-stat-card>
        <app-stat-card label="Certificados emitidos" [value]="resumen.totalCertificados" icon="workspace_premium"></app-stat-card>
        <app-stat-card label="Ingresos aprobados" [value]="(resumen.ingresosGenerados | currency:'Bs ')" icon="payments"></app-stat-card>
      </div>
    </section>

    <section class="organizer-dashboard__section" *ngIf="operativo() as operacion" aria-labelledby="operations-title">
      <h2 id="operations-title">Operación</h2>
      <div class="organizer-dashboard__stats">
        <app-stat-card label="Eventos publicados" [value]="operacion.eventosActivos" icon="campaign"></app-stat-card>
        <app-stat-card label="Eventos finalizados" [value]="operacion.eventosFinalizados" icon="event_available"></app-stat-card>
        <app-stat-card label="Pagos pendientes de validación" [value]="operacion.pagosPendientes" icon="pending_actions"></app-stat-card>
        <app-stat-card label="Pagos aprobados" [value]="operacion.pagosValidados" icon="task_alt"></app-stat-card>
        <app-stat-card label="Asistencias registradas" [value]="operacion.asistenciasRegistradas" icon="how_to_reg"></app-stat-card>
      </div>
    </section>

    <section class="organizer-dashboard__section" *ngIf="academico() as resumenCategorias" aria-labelledby="categories-title">
      <h2 id="categories-title">Eventos por categoría</h2>
      <app-empty-state *ngIf="resumenCategorias.participacionPorCategoria.length === 0"
        icon="category" title="Sin eventos categorizados"
        message="Todavía no hay eventos propios para resumir por categoría."></app-empty-state>
      <div class="organizer-dashboard__categories" *ngIf="resumenCategorias.participacionPorCategoria.length > 0">
        <app-surface *ngFor="let item of resumenCategorias.participacionPorCategoria" variant="default">
          <span>{{ item.name }}</span>
          <strong>{{ item.value }}</strong>
        </app-surface>
      </div>
    </section>
  </ng-container>
</main>
