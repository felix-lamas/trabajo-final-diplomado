<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ng-container *ngFor="let item of items; let last = last">
    <a *ngIf="item.route && !last; else currentItem" class="breadcrumbs__item" [routerLink]="item.route">
      <mat-icon *ngIf="item.icon">{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
    <ng-template #currentItem>
      <span class="breadcrumbs__item breadcrumbs__item--current">
        <mat-icon *ngIf="item.icon">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </span>
    </ng-template>
    <mat-icon *ngIf="!last" class="breadcrumbs__separator">chevron_right</mat-icon>
  </ng-container>
</nav>
