<button
  class="vidia-icon-button"
  type="button"
  [attr.aria-label]="ariaLabel"
  [attr.aria-expanded]="ariaExpanded"
  [attr.aria-pressed]="ariaPressed"
  [matTooltip]="tooltip || ''"
  [disabled]="disabled"
  (click)="pressed.emit($event)">
  <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
</button>
