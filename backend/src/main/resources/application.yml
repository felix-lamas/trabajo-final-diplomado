spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ${APP_NAME:eventos-uajms}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
      # Límites de 5 s evitan esperas SMTP indefinidas sin retrasar demasiado solicitudes.
      "[mail.smtp.connectiontimeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
      "[mail.smtp.timeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
      "[mail.smtp.writetimeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:uajms_eventos}}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # El esquema histórico se creaba con Hibernate; se marca en V0 y V1 aplica
    # cambios aditivos. En esquemas vacíos, Hibernate crea las tablas al iniciar.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:${PORT:8080}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    # Credencial exclusiva para usuarios de demostración/desarrollo; no usar en producción.
    demo-password: ${DEMO_PASSWORD}
  jwt:
    secreto: ${JWT_SECRET}
    expiracion-ms: ${JWT_EXPIRATION:86400000}
  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/auth/restablecer-contrasena}
    verify-email-url: ${FRONTEND_VERIFY_EMAIL_URL:http://localhost:4200/auth/verificar-correo}
  mail:
    provider: ${MAIL_PROVIDER:brevo-api}
    from: ${MAIL_FROM:appvidia@gmail.com}
    from-name: ${MAIL_FROM_NAME:Vidia}
  uploads:
    base-dir: ${UPLOADS_BASE_DIR:uploads}
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
    supabase:
      endpoint: ${SUPABASE_STORAGE_ENDPOINT:}
      region: ${SUPABASE_STORAGE_REGION:us-east-2}
      bucket: ${SUPABASE_STORAGE_BUCKET:vidia-comprobantes}
      access-key: ${SUPABASE_STORAGE_ACCESS_KEY:}
      secret-key: ${SUPABASE_STORAGE_SECRET_KEY:}
      connection-timeout-ms: ${SUPABASE_STORAGE_CONNECTION_TIMEOUT_MS:5000}
      api-timeout-ms: ${SUPABASE_STORAGE_API_TIMEOUT_MS:20000}
  certificados:
    verificacion-base-url: ${CERTIFICATE_VERIFICATION_BASE_URL:http://localhost:4200/verificar-certificado}

springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
