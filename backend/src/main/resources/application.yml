spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ${APP_NAME:eventos-uajms}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:uajms_eventos}}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    # Credencial exclusiva para usuarios de demostración/desarrollo; no usar en producción.
    demo-password: ${DEMO_PASSWORD}
  jwt:
    secreto: ${JWT_SECRET}
    expiracion-ms: ${JWT_EXPIRATION:86400000}
  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/auth/reset-contrasena}
  mail:
    from: ${MAIL_FROM:no-reply@example.invalid}
  uploads:
    base-dir: ${UPLOADS_BASE_DIR:uploads}

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    operations-sorter: alpha
