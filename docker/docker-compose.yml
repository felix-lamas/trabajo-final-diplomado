services:
  database:
    image: postgres:16-alpine
    container_name: uajms_eventos_db
    environment:
      POSTGRES_DB: ${DB_NAME:?Configure DB_NAME in ../.env}
      POSTGRES_USER: ${DB_USER:?Configure DB_USER in ../.env}
      POSTGRES_PASSWORD: ${DB_PASS:?Configure DB_PASS in ../.env}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../database/scripts:/docker-entrypoint-initdb.d
    networks:
      - uajms_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: uajms_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Configure PGADMIN_EMAIL in ../.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Configure PGADMIN_PASSWORD in ../.env}
    ports:
      - "5050:80"
    depends_on:
      - database
    networks:
      - uajms_network

networks:
  uajms_network:
    driver: bridge

volumes:
  db_data:
