name: vidia
description: Donde los eventos cobran vida.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ">=6.1.2 <7.0.0"
  app_links: 7.2.2
  crypto: ^3.0.7
  http: ^1.5.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4
  file_picker: 10.3.7
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  geolocator: 14.0.2
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/vidia_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vidia_logo.png"
  min_sdk_android: 21
