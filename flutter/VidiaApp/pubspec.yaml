name: vidia
description: Donde los eventos cobran vida.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ">=6.1.2 <7.0.0"
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/vidia_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vidia_logo.png"
  min_sdk_android: 21
